<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gold BC - Member Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDKs (v9 Compat Mode) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- ==================== 1. LOGIN / OTP CARD ==================== -->
  <div id="login-card" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-md">
      <h2 class="text-2xl font-bold mb-4 text-center text-amber-600">Gold BC Member Portal</h2>
      
      <!-- Status / Error Banner -->
      <div id="status-msg" class="hidden mb-4 p-3 rounded text-sm font-medium"></div>

      <!-- Step 1: Phone Input -->
      <div id="phone-section" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Mobile Number</label>
          <input 
            type="tel" 
            id="phone-number" 
            placeholder="9876543210" 
            class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-amber-500 focus:border-amber-500 text-lg"
          />
          <p class="text-xs text-gray-500 mt-1">Enter 10-digit number. Country code <b>+91</b> will be added automatically.</p>
        </div>

        <div id="recaptcha-container"></div>

        <button 
          onclick="handleSendOTP()" 
          id="send-otp-btn"
          class="w-full bg-amber-600 text-white py-2 rounded font-medium hover:bg-amber-700 transition"
        >
          Send Verification Code
        </button>
      </div>

      <!-- Step 2: OTP Input -->
      <div id="otp-section" class="space-y-4 hidden">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Enter 6-Digit OTP</label>
          <input 
            type="text" 
            id="otp-code" 
            placeholder="123456" 
            maxlength="6"
            class="w-full px-3 py-2 border border-gray-300 rounded text-center text-xl tracking-widest focus:ring-amber-500 focus:border-amber-500"
          />
        </div>

        <button 
          onclick="handleVerifyOTP()" 
          id="verify-otp-btn"
          class="w-full bg-green-600 text-white py-2 rounded font-medium hover:bg-green-700 transition"
        >
          Verify & Sign In
        </button>
        
        <button 
          onclick="resetForm()" 
          class="w-full text-sm text-gray-500 hover:underline text-center block"
        >
          Change Phone Number
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 2. MEMBER DASHBOARD ==================== -->
  <div id="dashboard-section" class="hidden min-h-screen">
    <!-- Navbar -->
    <nav class="bg-amber-600 text-white shadow-lg px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-2xl font-black tracking-wider">GOLD BC</span>
        <span class="text-xs bg-amber-800 px-2 py-0.5 rounded text-amber-100 font-semibold">PORTAL</span>
      </div>
      <div class="flex items-center space-x-4">
        <span id="dash-user-phone" class="text-sm font-medium bg-amber-700 px-3 py-1 rounded-full"></span>
        <button 
          onclick="handleSignOut()" 
          class="bg-white text-amber-700 hover:bg-amber-100 text-xs font-bold py-1.5 px-3 rounded transition"
        >
          Sign Out
        </button>
      </div>
    </nav>

    <!-- Dashboard Content Container -->
    <main class="max-w-6xl mx-auto p-6">
      <!-- Welcome Banner -->
      <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Welcome to Gold BC Dashboard</h1>
        <p class="text-gray-600 text-sm mt-1">You are logged in as an authorized member.</p>
        <p id="dash-user-uid" class="text-xs font-mono text-gray-400 mt-2 break-all"></p>
      </div>

      <!-- Quick Stats / Cards Grid -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Card 1 -->
        <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Account Status</p>
          <p class="text-xl font-bold text-green-600 mt-2">Active Member</p>
        </div>

        <!-- Card 2 -->
        <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">BC Data Access</p>
          <p class="text-xl font-bold text-amber-600 mt-2">Authorized</p>
        </div>

        <!-- Card 3 -->
        <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Security Level</p>
          <p class="text-xl font-bold text-blue-600 mt-2">Phone Verified</p>
        </div>
      </div>
    </main>
  </div>

  <!-- ==================== JAVASCRIPT ==================== -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBf3P-b_oJ1q0eSGE84vr4IEOxy7Ouc1jM",
      authDomain: "gold-bc.firebaseapp.com",
      databaseURL: "https://gold-bc-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gold-bc",
      storageBucket: "gold-bc.firebasestorage.app",
      messagingSenderId: "680447220213",
      appId: "1:680447220213:web:22ef4a8ebe02401c9e68bc"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    window.onload = function() {
      window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
        'size': 'invisible'
      });
    };

    function showMessage(msg, isError = false) {
      const el = document.getElementById('status-msg');
      el.innerText = msg;
      el.className = `mb-4 p-3 rounded text-sm font-medium ${isError ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}`;
      el.classList.remove('hidden');
    }

    function formatPhoneNumber(input) {
      let cleaned = input.trim().replace(/[\s\-\(\)]/g, '');
      if (!cleaned) return '';
      if (cleaned.startsWith('0')) cleaned = cleaned.substring(1);
      if (cleaned.startsWith('+')) return cleaned;
      return '+91' + cleaned;
    }

    async function handleSendOTP() {
      const rawInput = document.getElementById('phone-number').value;
      const phoneNumber = formatPhoneNumber(rawInput);
      
      if (!/^\+91\d{10}$/.test(phoneNumber) && !/^\+\d{10,15}$/.test(phoneNumber)) {
        showMessage("Please enter a valid 10-digit mobile number.", true);
        return;
      }

      showMessage(`Checking authorization...`);

      try {
        const snapshot = await db.ref('bc_data/allowedNumbers').once('value');
        const allowedData = snapshot.val() || {};
        const allowedNumbers = Array.isArray(allowedData) ? allowedData : Object.values(allowedData);

        if (!allowedNumbers.includes(phoneNumber)) {
          showMessage(`Access Denied: ${phoneNumber} is not on the allowed list.`, true);
          return;
        }

        showMessage(`Sending verification code to ${phoneNumber}...`);
        window.confirmationResult = await auth.signInWithPhoneNumber(phoneNumber, window.recaptchaVerifier);

        document.getElementById('phone-section').classList.add('hidden');
        document.getElementById('otp-section').classList.remove('hidden');
        showMessage(`OTP sent successfully to ${phoneNumber}`);

      } catch (error) {
        console.error("Error sending OTP:", error);
        showMessage(error.message || "Failed to send OTP.", true);
        if (window.recaptchaVerifier) {
          window.recaptchaVerifier.render().then(widgetId => grecaptcha.reset(widgetId));
        }
      }
    }

    async function handleVerifyOTP() {
      const otpCode = document.getElementById('otp-code').value.trim();
      if (otpCode.length !== 6) {
        showMessage("Please enter a valid 6-digit code.", true);
        return;
      }

      showMessage("Verifying code...");

      try {
        const result = await window.confirmationResult.confirm(otpCode);
        const user = result.user;

        const userRef = db.ref(`users/${user.uid}`);
        const userSnapshot = await userRef.once('value');

        if (!userSnapshot.exists()) {
          await userRef.set({
            uid: user.uid,
            phoneNumber: user.phoneNumber,
            role: "member",
            createdAt: firebase.database.ServerValue.TIMESTAMP,
            status: "active"
          });
        }

        showAuthenticatedUI(user);

      } catch (error) {
        console.error("Verification failed:", error);
        showMessage("Invalid OTP code. Please try again.", true);
      }
    }

    // Displays the Dashboard view and hides login card
    function showAuthenticatedUI(user) {
      document.getElementById('login-card').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');
      
      document.getElementById('dash-user-phone').innerText = user.phoneNumber;
      document.getElementById('dash-user-uid').innerText = "UID: " + user.uid;
    }

    function handleSignOut() {
      auth.signOut().then(() => {
        resetForm();
      });
    }

    function resetForm() {
      document.getElementById('dashboard-section').classList.add('hidden');
      document.getElementById('login-card').classList.remove('hidden');
      document.getElementById('phone-section').classList.remove('hidden');
      document.getElementById('otp-section').classList.add('hidden');
      document.getElementById('phone-number').value = '';
      document.getElementById('otp-code').value = '';
      document.getElementById('status-msg').classList.add('hidden');
    }

    auth.onAuthStateChanged((user) => {
      if (user) {
        showAuthenticatedUI(user);
      } else {
        resetForm();
      }
    });
  </script>
</body>
</html>
