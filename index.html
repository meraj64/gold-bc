<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gold BC - Phone Auth</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDKs (v9 Compat Mode for script tags) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-4 text-center text-amber-600">Gold BC Member Portal</h2>
    
    <!-- Status / Error Banner -->
    <div id="status-msg" class="hidden mb-4 p-3 rounded text-sm font-medium"></div>

    <!-- Step 1: Phone Number Input -->
    <div id="phone-section" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
        <input 
          type="tel" 
          id="phone-number" 
          placeholder="+919876543210" 
          class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-amber-500 focus:border-amber-500"
        />
        <p class="text-xs text-gray-500 mt-1">Include country code (e.g., +91 for India)</p>
      </div>

      <!-- Recaptcha Container -->
      <div id="recaptcha-container"></div>

      <button 
        onclick="handleSendOTP()" 
        id="send-otp-btn"
        class="w-full bg-amber-600 text-white py-2 rounded hover:bg-amber-700 transition"
      >
        Send Verification Code
      </button>
    </div>

    <!-- Step 2: OTP Verification Input (Hidden initially) -->
    <div id="otp-section" class="space-y-4 hidden">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Enter 6-Digit OTP</label>
        <input 
          type="text" 
          id="otp-code" 
          placeholder="123456" 
          maxlength="6"
          class="w-full px-3 py-2 border border-gray-300 rounded text-center text-xl tracking-widest focus:ring-amber-500 focus:border-amber-500"
        />
      </div>

      <button 
        onclick="handleVerifyOTP()" 
        id="verify-otp-btn"
        class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition"
      >
        Verify & Sign In
      </button>
      
      <button 
        onclick="resetForm()" 
        class="w-full text-sm text-gray-500 hover:underline text-center block"
      >
        Change Phone Number
      </button>
    </div>

    <!-- Step 3: Success Screen (Hidden initially) -->
    <div id="user-profile" class="hidden text-center space-y-4">
      <div class="p-4 bg-green-50 border border-green-200 rounded text-green-800">
        <p class="font-bold">Successfully Authenticated!</p>
        <p id="user-uid" class="text-xs font-mono mt-1"></p>
        <p id="user-phone" class="text-sm font-medium mt-1"></p>
      </div>
      <button 
        onclick="handleSignOut()" 
        class="w-full bg-gray-600 text-white py-2 rounded hover:bg-gray-700 transition"
      >
        Sign Out
      </button>
    </div>
  </div>

  <script>
    // 1. Firebase Configuration (Replace with your Firebase Project details)
   const firebaseConfig = {
  apiKey: "AIzaSyBf3P-b_oJ1q0eSGE84vr4IEOxy7Ouc1jM",
  authDomain: "gold-bc.firebaseapp.com",
  databaseURL: "https://gold-bc-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "gold-bc",
  storageBucket: "gold-bc.firebasestorage.app",
  messagingSenderId: "680447220213",
  appId: "1:680447220213:web:22ef4a8ebe02401c9e68bc"
};

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // 2. Initialize Invisible Recaptcha Verifier
    window.onload = function() {
      window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
        'size': 'invisible',
        'callback': (response) => {
          // reCAPTCHA solved - allow signInWithPhoneNumber
        }
      });
    };

    // Helper UI Function for Messages
    function showMessage(msg, isError = false) {
      const el = document.getElementById('status-msg');
      el.innerText = msg;
      el.className = `mb-4 p-3 rounded text-sm font-medium ${isError ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}`;
      el.classList.remove('hidden');
    }

    // 3. STEP 1: Check Allowed List & Send OTP
    async function handleSendOTP() {
      const phoneNumber = document.getElementById('phone-number').value.trim();
      
      if (!phoneNumber.startsWith('+')) {
        showMessage("Please include country code starting with '+' (e.g., +91)", true);
        return;
      }

      showMessage("Checking authorization...");

      try {
        // A. Verify if number exists in /allowedNumbers database node
        const snapshot = await db.ref('allowedNumbers').once('value');
        const allowedData = snapshot.val() || {};
        
        // Convert node values to array if saved as object/map
        const allowedNumbers = Array.isArray(allowedData) 
          ? allowedData 
          : Object.values(allowedData);

        const isAllowed = allowedNumbers.includes(phoneNumber);

        if (!isAllowed) {
          showMessage("Access Denied: This phone number is not on the allowed list.", true);
          return;
        }

        // B. Send OTP if authorized
        showMessage("Sending verification code...");
        const appVerifier = window.recaptchaVerifier;
        window.confirmationResult = await auth.signInWithPhoneNumber(phoneNumber, appVerifier);

        // C. Update UI for OTP entry
        document.getElementById('phone-section').classList.add('hidden');
        document.getElementById('otp-section').classList.remove('hidden');
        showMessage("OTP sent successfully to " + phoneNumber);

      } catch (error) {
        console.error("Error sending OTP:", error);
        showMessage(error.message || "Failed to send OTP.", true);
        // Reset Recaptcha on failure
        if (window.recaptchaVerifier) window.recaptchaVerifier.render().then(widgetId => grecaptcha.reset(widgetId));
      }
    }

    // 4. STEP 2: Verify OTP & Automatically Register/Login
    async function handleVerifyOTP() {
      const otpCode = document.getElementById('otp-code').value.trim();
      if (otpCode.length !== 6) {
        showMessage("Please enter a valid 6-digit code.", true);
        return;
      }

      showMessage("Verifying code...");

      try {
        // A. Verify OTP
        const result = await window.confirmationResult.confirm(otpCode);
        const user = result.user;

        // B. Check if this is a NEW user or existing profile
        const userRef = db.ref(`users/${user.uid}`);
        const userSnapshot = await userRef.once('value');

        if (!userSnapshot.exists()) {
          // ✨ AUTOMATIC USER SIGNUP IN REALTIME DATABASE ✨
          await userRef.set({
            uid: user.uid,
            phoneNumber: user.phoneNumber,
            role: "member",
            createdAt: firebase.database.ServerValue.TIMESTAMP,
            status: "active"
          });
          console.log("New user registered automatically in DB:", user.uid);
          showMessage("Welcome! Account created successfully.");
        } else {
          console.log("Existing user logged in:", user.uid);
          showMessage("Welcome back!");
        }

        // C. Show Authenticated View
        showAuthenticatedUI(user);

      } catch (error) {
        console.error("Verification failed:", error);
        showMessage("Invalid OTP code. Please try again.", true);
      }
    }

    // Show Logged-in Screen
    function showAuthenticatedUI(user) {
      document.getElementById('phone-section').classList.add('hidden');
      document.getElementById('otp-section').classList.add('hidden');
      document.getElementById('user-profile').classList.remove('hidden');
      
      document.getElementById('user-uid').innerText = "UID: " + user.uid;
      document.getElementById('user-phone').innerText = "Phone: " + user.phoneNumber;
    }

    // Sign Out
    function handleSignOut() {
      auth.signOut().then(() => {
        resetForm();
        showMessage("Signed out successfully.");
      });
    }

    // Reset Form to initial state
    function resetForm() {
      document.getElementById('phone-section').classList.remove('hidden');
      document.getElementById('otp-section').classList.add('hidden');
      document.getElementById('user-profile').classList.add('hidden');
      document.getElementById('phone-number').value = '';
      document.getElementById('otp-code').value = '';
      document.getElementById('status-msg').classList.add('hidden');
    }

    // Listen for Auth State changes
    auth.onAuthStateChanged((user) => {
      if (user) {
        showAuthenticatedUI(user);
      }
    });
  </script>
</body>
</html>
